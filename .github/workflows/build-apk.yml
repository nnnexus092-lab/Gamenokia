name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Kode
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Install Capacitor
      run: |
        npm init -y
        npm install @capacitor/core @capacitor/cli @capacitor/android

    - name: Buat Konfigurasi Capacitor
      run: |
        echo '{
          "appId": "com.nokia.snake",
          "appName": "Nokia Snake",
          "webDir": "."
        }' > capacitor.config.json

    - name: Tambah Platform Android
      run: |
        npx cap add android
        npx cap sync

    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Simpan File APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-Game-Nokia
        path: android/app/build/outputs/apk/debug/*.apk
