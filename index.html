<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Nokia Snake 3310</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:"Courier New",monospace;background:#2a2a2a;background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;user-select:none;-webkit-tap-highlight-color:transparent}.phone{background:linear-gradient(180deg,#3a3f36,#1f221c);padding:20px 18px 26px;border-radius:40px 40px 60px 60px;box-shadow:0 20px 50px rgba(0,0,0,.7),inset 0 2px 4px rgba(255,255,255,.15),inset 0 -4px 12px rgba(0,0,0,.6);border:2px solid #0e0f0c;max-width:380px;width:100%}.brand{text-align:center;color:#9ca38f;font-size:.7rem;letter-spacing:4px;font-weight:bold;margin-bottom:8px;text-shadow:0 1px 0 #000}.lcd-bezel{background:#1a1c16;padding:14px;border-radius:12px;box-shadow:inset 0 0 20px rgba(0,0,0,.9),0 2px 4px rgba(255,255,255,.1)}.lcd{background:#9bbc0f;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.06) 0 1px,transparent 1px 3px);border-radius:4px;padding:8px;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}.lcd-hud{display:flex;justify-content:space-between;align-items:center;font-family:"Courier New",monospace;font-weight:bold;color:#0f380f;font-size:.75rem;padding:2px 4px 6px;letter-spacing:1px}.lcd-hud .label{opacity:.8}.lcd-hud .value{color:#0f380f}.lcd-inner{background:#8bac0f;border:2px solid #0f380f;border-radius:2px;position:relative;overflow:hidden;aspect-ratio:1/1}#game-frame{display:block;width:100%;height:100%;border:0;background:#8bac0f}.bottom-menu{display:flex;gap:4px;margin-top:15px;padding:0 4px}.menu-btn{flex:1;background:linear-gradient(180deg,#5a6051,#3a3f36);border:2px solid #0e0f0c;color:#d4dac4;font-family:"Courier New",monospace;font-size:.5rem;font-weight:bold;padding:10px 1px;border-radius:20px;cursor:pointer;box-shadow:0 3px 0 #0e0f0c,inset 0 1px 0 rgba(255,255,255,.15);letter-spacing:0px;text-decoration:none;text-align:center}.menu-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0e0f0c}.keypad{margin-top:18px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 8px}.keypad button{background:linear-gradient(180deg,#4a4f42,#2c3027);border:2px solid #0e0f0c;color:#d4dac4;font-family:"Courier New",monospace;font-size:1.2rem;font-weight:bold;padding:14px 0;border-radius:8px;cursor:pointer;box-shadow:0 3px 0 #0e0f0c,inset 0 1px 0 rgba(255,255,255,.15);transition:all .05s;-webkit-tap-highlight-color:transparent}.keypad button:active,.keypad button.pressed{transform:translateY(3px);box-shadow:0 0 0 #0e0f0c,inset 0 1px 0 rgba(255,255,255,.1);background:linear-gradient(180deg,#2c3027,#1f221c)}.keypad .empty{visibility:hidden}.softkeys{display:flex;justify-content:space-between;margin-top:14px;gap:8px}.softkeys button{flex:1;background:linear-gradient(180deg,#5a6051,#3a3f36);border:2px solid #0e0f0c;color:#d4dac4;font-family:"Courier New",monospace;font-size:.7rem;font-weight:bold;padding:8px;border-radius:20px;cursor:pointer;box-shadow:0 3px 0 #0e0f0c,inset 0 1px 0 rgba(255,255,255,.15);letter-spacing:1px}.softkeys button:active{transform:translateY(2px);box-shadow:0 1px 0 #0e0f0c}@media(hover:hover) and (pointer:fine){.keypad,.softkeys,.bottom-menu{display:none}.phone{padding-bottom:20px}}.hint{text-align:center;color:#6b7263;font-size:.65rem;margin-top:14px;letter-spacing:1px}</style></head><body><div class="phone"><div class="brand">NOKIA</div><div class="lcd-bezel"><div class="lcd"><div class="lcd-hud"><span><span class="label" id="hud-player">PLAYER 1</span></span><span><span class="label">SKOR</span> <span class="value" id="score">0</span></span><span><span class="label" id="hud-label">LVL</span> <span class="value" id="level">1</span></span></div><div class="lcd-inner"><iframe id="game-frame" src="game.html" title="Game Snake"></iframe></div></div></div><div class="bottom-menu"><a href="local2p.html" class="menu-btn" style="color:#8bac0f; text-shadow:0 0 5px #8bac0f;">2P LOKAL</a><a href="profil.html" class="menu-btn">PROFIL</a><a href="skin.html" class="menu-btn" style="color:#8bac0f;">SKIN</a><a href="backup.html" class="menu-btn">BACKUP</a></div><div class="keypad"><button class="empty"></button><button data-dir="up">▲</button><button class="empty"></button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div><div class="softkeys"><button id="pause-btn">PAUSE</button><button id="restart-btn">ULANG</button></div><div class="hint">↕ swipe / panah / WASD • spasi = pause</div></div><script>const frame=document.getElementById('game-frame'),scoreEl=document.getElementById('score'),levelEl=document.getElementById('level'),hudLabel=document.getElementById('hud-label'),hudPlayer=document.getElementById('hud-player');function loadProfile(){const e=JSON.parse(localStorage.getItem('nokiaSnakeProfile'))||{name:'PLAYER 1',avatar:'🐍'};hudPlayer.textContent=`${e.avatar} ${e.name}`}loadProfile(),window.addEventListener('focus',loadProfile);const send=e=>frame.contentWindow?.postMessage(e,'*');window.addEventListener('message',e=>{const t=e.data;if(t&&'object'==typeof t&&'score'===t.type){scoreEl.textContent=t.score;null!==t.timeLeft&&void 0!==t.timeLeft?(hudLabel.textContent='TIME',levelEl.textContent=t.timeLeft):(hudLabel.textContent='LVL',levelEl.textContent=t.level)}});const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};document.querySelectorAll('[data-dir]').forEach(e=>{e.addEventListener('click',()=>{const[t,n]=DIRS[e.dataset.dir];send({type:'dir',x:t,y:n}),e.blur()})}),document.getElementById('pause-btn').onclick=e=>{send({type:'pause'}),e.currentTarget.blur()},document.getElementById('restart-btn').onclick=e=>{send({type:'restart'}),e.currentTarget.blur()},document.addEventListener('keydown',e=>{const t=e.key,n={ArrowUp:[0,-1],w:[0,-1],W:[0,-1],ArrowDown:[0,1],s:[0,1],S:[0,1],ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],ArrowRight:[1,0],d:[1,0],D:[1,0]};if(n[t]){const[e,i]=n[t];send({type:'dir',x:e,y:i}),e.preventDefault()}else' '===t&&(send({type:'pause'}),e.preventDefault())});</script></body></html>
