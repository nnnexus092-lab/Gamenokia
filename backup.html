<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Backup Data</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Courier New", monospace; background: #2a2a2a; color: #d4dac4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; user-select: none; -webkit-tap-highlight-color: transparent; }
  .phone { background: linear-gradient(180deg, #3a3f36, #1f221c); padding: 30px 20px; border-radius: 40px 40px 60px 60px; box-shadow: 0 20px 50px rgba(0,0,0,.7), inset 0 2px 4px rgba(255,255,255,.15), inset 0 -4px 12px rgba(0,0,0,.6); border: 2px solid #0e0f0c; max-width: 380px; width: 100%; text-align: center; }
  h2 { color: #9ca38f; letter-spacing: 2px; margin-bottom: 20px; text-transform: uppercase; font-size: 1.2rem; }
  p { font-size: .85rem; margin-bottom: 20px; color: #9bbc0f; line-height: 1.4; }
  .btn { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 2px solid #0e0f0c; background: #0f380f; color: #9bbc0f; font-family: "Courier New", monospace; font-weight: bold; font-size: 1rem; cursor: pointer; box-shadow: 0 4px 0 #0e0f0c; transition: all .05s; }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 #0e0f0c; }
  .btn.alt { background: transparent; color: #9ca38f; box-shadow: 0 4px 0 #0e0f0c; }
  input[type=file] { display: none; }
  .file-label { display: block; width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 2px dashed #306230; color: #9bbc0f; font-weight: bold; font-size: .9rem; cursor: pointer; text-align: center; }
  .file-label:hover { background: #1a1c16; }
</style>
</head>
<body>
  <div class="phone">
    <h2>Backup & Restore</h2>
    <p>Simpan <b>semua</b> rekor skor (Solo & 2P), Profil, dan Warna Skin ke file. Atau pulihkan dari file cadangan.</p>

    <button class="btn" id="export-btn">⬇️ DOWNLOAD BACKUP (.JSON)</button>
    <label for="import-file" class="file-label">⬆️ PILIH FILE UNTUK RESTORE</label>
    <input type="file" id="import-file" accept=".json">
    <button class="btn alt" onclick="window.location.href='index.html'">KEMBALI KE GAME</button>
  </div>

<script>
  // 1. FITUR EXPORT (Download Semua Data)
  document.getElementById('export-btn').addEventListener('click', () => {
    let backupData = {};
    
    // Looping semua data di localStorage
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      // Ambil semua data yang berawalan 'nokiaSnake' (Skor, Profil) dan 'snakeSkinIndex' (Warna)
      if (key.startsWith('nokiaSnake') || key === 'snakeSkinIndex') {
        backupData[key] = localStorage.getItem(key);
      }
    }

    // Jika tidak ada data sama sekali
    if (Object.keys(backupData).length === 0) {
      alert("Belum ada data yang tersimpan untuk di-backup!");
      return;
    }

    // Buat file JSON dan unduh
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(backupData, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "nokia_snake_full_backup.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
  });

  // 2. FITUR IMPORT (Restore Semua Data)
  document.getElementById('import-file').addEventListener('change', function(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      try {
        const importedData = JSON.parse(e.target.result);
        
        // Kembalikan semua data ke localStorage
        for (const key in importedData) {
          if (key.startsWith('nokiaSnake') || key === 'snakeSkinIndex') {
            localStorage.setItem(key, importedData[key]);
          }
        }

        alert('Semua data (Skor, Profil, dan Skin) berhasil dipulihkan!');
        window.location.href = 'index.html'; // Kembali ke game
      } catch (err) {
        alert('Gagal memulihkan data. Pastikan file .json valid.');
      }
    };
    reader.readAsText(file);
  });
</script>
</body>
</html>
